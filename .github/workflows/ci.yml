name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run pointless, so cancel it
# rather than paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # `next build` needs the environment to resolve, and the placeholder values
    # are enough: the pages that would touch Supabase during prerender either
    # tolerate the request failing or are dynamic. Nothing here is a real
    # credential and nothing is contacted — production values live in the
    # hosting dashboard, never in this file.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      CLOUDINARY_CLOUD_NAME: placeholder
      CLOUDINARY_API_KEY: placeholder
      CLOUDINARY_API_SECRET: placeholder
      RESEND_API_KEY: placeholder
      ORDER_FROM_EMAIL: onboarding@resend.dev
      ORDER_RECEIVER_EMAIL: placeholder@example.com
      NEXT_PUBLIC_STORE_NAME: Biniso
      NEXT_PUBLIC_STORE_ADDRESS: Dhaka, Bangladesh
      NEXT_PUBLIC_STORE_PHONE: "01XXXXXXXXX"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `ci` not `install`, so the lockfile is authoritative.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
